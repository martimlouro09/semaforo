<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semáforo manual</title>

  <!-- Bootstrap 4.0 -->
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="painel text-center">
    <h1 class="h3 mb-1">Semáforo manual</h1>
    <p id="estado" class="estado" role="status" aria-live="polite">Semáforo desligado</p>

    <img id="semaforo" class="semaforo-img"
         src="Imagens/semaforo_desligado.png" alt="Semáforo desligado">

    <div class="botoes desligado" id="botoes">
      <!-- Primeiro botão: liga o semáforo com a cor vermelha -->
      <button type="button" class="btn btn-danger btn-lg" id="btn-vermelho" data-cor="vermelho">Ligar</button>
      <button type="button" class="btn btn-warning btn-lg" data-cor="amarelo" hidden>Amarelo</button>
      <button type="button" class="btn btn-success btn-lg" data-cor="verde" hidden>Verde</button>
      <button type="button" class="btn btn-secondary btn-lg" data-cor="desligado" hidden>Desligar</button>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
